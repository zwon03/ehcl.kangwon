
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="강원대학교 환경보건화학연구실 EHCL - 게시글">
  <title>게시글 | Community · EHCL</title>
  <style>
    :root {
      --navy: #123047;
      --teal: #4f9a91;
      --ink: #20323c;
      --muted: #647780;
      --paper: #f7f9f8;
      --line: #e1e9e7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      line-height: 1.75;
      background: #fff;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
   /* EHCL 헤더 */
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--navy);
  text-decoration: none;
  flex-shrink: 0;
}

.mark {
  width: 100px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  background: transparent;
  border-radius: 0;
}

.mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.brand-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 5px;
}

.brand strong {
  display: inline;
  font-size: 1.2rem;
  letter-spacing: 0;
  font-weight: 800;
}

.brand-korean {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--navy);
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.4;
}
    nav { display: flex; align-items: center; gap: 24px; font-size: .88rem; font-weight: 600; }
    nav a:hover, nav a.active { color: var(--teal); }
    .menu-toggle {
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      color: var(--navy);
    }

    .page-hero {
      background: linear-gradient(120deg,#102d43 0%,#1c4a5b 72%,#367d79 100%);
      color: #fff;
      padding: 64px 0;
    }
    .eyebrow { color: #a9d9ce; font-size: .76rem; letter-spacing: .16em; font-weight: 700; }
    .page-hero h1 { margin: 12px 0; font-size: clamp(2.2rem,5vw,3.4rem); line-height: 1.2; }
    .crumb { margin-top: 20px; color: #d8e5e9; font-size: .85rem; }
    .crumb a { color: #b5e4d7; text-decoration: underline; text-underline-offset: 3px; }

    main { padding: 58px 0 76px; }
    .breadcrumb { margin-bottom: 22px; color: var(--muted); font-size: .88rem; }
    .breadcrumb a:hover { color: var(--teal); }
    .post { border-top: 2px solid var(--navy); }
    .post-header { padding: 24px 12px; border-bottom: 1px solid var(--line); }
    .post-header h2 { margin: 0 0 10px; color: var(--navy); font-size: clamp(1.35rem,3vw,1.9rem); line-height: 1.45; }
    .post-date { color: var(--muted); font-size: .88rem; }
    .attachment { padding: 16px 12px; border-bottom: 1px solid var(--line); }
    .attachment strong { margin-right: 14px; color: var(--navy); }
    .attachment a { color: #347c74; text-decoration: underline; overflow-wrap: anywhere; }
    .post-body { min-height: 220px; padding: 32px 12px 48px; overflow-wrap: anywhere; }
    .post-body img { max-width: 100%; height: auto; }
    .post-body p { margin: 0 0 1em; }
    .post-body .post-image { display: block; margin: 0 auto 24px; max-width: 100%; }
    .post-nav { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .post-nav a { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 16px 12px; }
    .post-nav a + a { border-top: 1px solid var(--line); }
    .post-nav a:hover { background: var(--paper); }
    .post-nav-label { color: var(--muted); font-size: .88rem; }
    .post-nav-title { color: var(--navy); overflow-wrap: anywhere; }
    .post-nav a.disabled { color: #9ba8ad; pointer-events: none; }
    .list-button {
      display: block;
      width: fit-content;
      margin: 26px auto 0;
      padding: 10px 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-weight: 700;
      color: var(--navy);
    }
    .list-button:hover { background: var(--paper); }

    footer { padding: 24px 0; background: #0c2232; color: #b9cbd1; font-size: .8rem; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }

    @media (max-width: 820px) {
      .menu-toggle { display: block; }
      nav {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 82px;
        padding: 18px 24px 24px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      nav.open { display: flex; }
    }
   @media (max-width: 820px) {
  .nav {
    gap: 12px;
  }

  .brand {
    gap: 10px;
  }

  .mark {
    width: 76px;
    height: 48px;
  }

  .brand strong {
    font-size: 1rem;
  }

  .brand-korean {
    font-size: 0.88rem;
  }

  .brand small {
    font-size: 0.68rem;
  }
}

@media (max-width: 560px) {
  .nav {
    gap: 8px;
  }

  .mark {
    width: 56px;
    height: 40px;
  }

  .brand {
    gap: 8px;
  }

  .brand-line {
    gap: 4px;
  }

  .brand strong {
    font-size: 0.9rem;
  }

  .brand-korean {
    font-size: 0.76rem;
  }

  .brand small {
    font-size: 0.58rem;
  }

  .menu-toggle {
    padding: 7px 8px;
    font-size: 0.8rem;
  }

  .post-nav a {
    grid-template-columns: 72px 1fr;
    gap: 8px;
  }
}
  </style>
</head>
<body>
<header>
  <div class="wrap nav">

    <a class="brand" href="index.html" aria-label="EHCL 메인으로">
      <span class="mark">
        <img src="kangwon-logo.png.png" alt="강원대학교 로고">
      </span>

      <span class="brand-text">
        <span class="brand-line">
          <strong>EHCL</strong>
          <b class="brand-korean">환경보건화학연구실</b>
        </span>
        <small>Environmental Health Chemistry Laboratory</small>
      </span>
    </a>

    <button class="menu-toggle" id="menuToggle"
      aria-expanded="false" aria-controls="mainNav">
      메뉴 ☰
    </button>

    <nav id="mainNav" aria-label="주요 메뉴">
      <a href="about.html">About</a>
      <a href="research.html">Research</a>
      <a href="members.html">People</a>
      <a href="publications.html">Publications</a>
      <a href="activities.html" class="active">Community</a>
      <a href="contact.html">Contact</a>
    </nav>

  </div>
</header>

<main class="wrap">
  <div class="breadcrumb">
    <a href="index.html">홈</a>　/　
    <a href="activities.html">Community</a>　/　
    <span>News</span>
  </div>

  <article class="post">
    <header class="post-header">
      <h2 id="postTitle">게시글을 불러오는 중입니다.</h2>
      <time class="post-date" id="postDate"></time>
    </header>

    <div class="attachment" id="attachmentSection" hidden>
      <strong>첨부파일</strong>
      <span id="attachmentList"></span>
    </div>

    <div class="post-body" id="postBody"></div>

    <nav class="post-nav" id="postNavigation" aria-label="이전글 및 다음글"></nav>
  </article>

  <a class="list-button" href="activities.html">목록으로</a>
</main>

<footer>
  <div class="wrap">
    <span>© EHCL · Environmental Health Chemistry Laboratory</span>
    <span>Kangwon National University</span>
  </div>
</footer>

<script>
const toggle = document.getElementById('menuToggle');
const nav = document.getElementById('mainNav');

toggle.addEventListener('click', () => {
  const isOpen = nav.classList.toggle('open');
  toggle.setAttribute('aria-expanded', String(isOpen));
});

nav.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    nav.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  });
});

const params = new URLSearchParams(window.location.search);
const requestedSlug = params.get('slug');

const titleEl = document.getElementById('postTitle');
const dateEl = document.getElementById('postDate');
const bodyEl = document.getElementById('postBody');
const attachmentSection = document.getElementById('attachmentSection');
const attachmentList = document.getElementById('attachmentList');
const navigationEl = document.getElementById('postNavigation');

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function getSlug(item) {
  return String(item.slug || item.title || '');
}

function renderBody(item) {
  const image = item.image
    ? `<img class="post-image" src="${escapeHTML(item.image)}" alt="${escapeHTML(item.title || '')}">`
    : '';

  const text = String(item.body || '')
    .split(/\n\s*\n/)
    .map(paragraph => `<p>${escapeHTML(paragraph).replace(/\n/g, '<br>')}</p>`)
    .join('');

  bodyEl.innerHTML = image + text;
}

function renderAttachments(item) {
  const files = Array.isArray(item.attachments)
    ? item.attachments
    : item.attachment
      ? [item.attachment]
      : [];

  if (!files.length) {
    attachmentSection.hidden = true;
    return;
  }

  attachmentSection.hidden = false;
  attachmentList.innerHTML = files.map(file => {
    const url = typeof file === 'string' ? file : file.url;
    const name = typeof file === 'string'
      ? file.split('/').pop()
      : file.name || file.url?.split('/').pop() || '첨부파일';

    if (!url) return '';
    return `<a href="${escapeHTML(url)}" target="_blank" rel="noopener">${escapeHTML(name)}</a> `;
  }).join('');
}

function renderNavigation(items, index) {
  const previous = items[index - 1];
  const next = items[index + 1];

  const makeLink = (item, label) => item
    ? `<a href="activity-detail.html?slug=${encodeURIComponent(getSlug(item))}">
         <span class="post-nav-label">${label}</span>
         <span class="post-nav-title">${escapeHTML(item.title || '제목 없음')}</span>
       </a>`
    : `<a class="disabled" href="#" aria-disabled="true">
         <span class="post-nav-label">${label}</span>
         <span class="post-nav-title">게시글이 없습니다.</span>
       </a>`;

  navigationEl.innerHTML = makeLink(previous, '이전글') + makeLink(next, '다음글');
}

fetch('./data/activities.json')
  .then(response => {
    if (!response.ok) throw new Error('게시글 데이터를 불러오지 못했습니다.');
    return response.json();
  })
  .then(items => {
    if (!Array.isArray(items)) throw new Error('게시글 데이터 형식이 올바르지 않습니다.');

    items.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

    const index = items.findIndex(item => getSlug(item) === requestedSlug);

    if (index < 0) {
      titleEl.textContent = '게시글을 찾을 수 없습니다.';
      dateEl.textContent = '';
      bodyEl.innerHTML = '<p>게시글이 삭제되었거나 주소가 올바르지 않습니다.</p>';
      attachmentSection.hidden = true;
      navigationEl.innerHTML = '';
      return;
    }

    const item = items[index];
    document.title = `${item.title || '게시글'} | Community · EHCL`;
    titleEl.textContent = item.title || '제목 없음';
    dateEl.textContent = item.date || '';
    renderBody(item);
    renderAttachments(item);
    renderNavigation(items, index);
  })
  .catch(error => {
    console.error(error);
    titleEl.textContent = '게시글을 불러오지 못했습니다.';
    dateEl.textContent = '';
    bodyEl.innerHTML = '<p>잠시 후 다시 시도해 주세요.</p>';
  });
</script>
</body>
</html>
