name: Update EHCL website data

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert Markdown to JSON
        run: |
          python -m pip install python-frontmatter
          python - <<'PY'
          import json
          import frontmatter
          from pathlib import Path

          for name in ["people", "publications", "activities"]:
              folder = Path("content") / name
              items = []
              if folder.exists():
                  for path in sorted(folder.glob("*.md")):
                      post = frontmatter.load(path)
                      item = dict(post.metadata)
                      item["body"] = post.content
                      items.append(item)
              Path("data").mkdir(exist_ok=True)
              (Path("data") / f"{name}.json").write_text(
                  json.dumps(items, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
          PY

      - name: Commit generated data
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update website data"
            git push
          fi
