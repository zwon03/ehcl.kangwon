
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="강원대학교 환경보건화학연구실 EHCL - News">
  <title>News | EHCL</title>

  <style>
    :root {
      --navy: #123047;
      --teal: #4f9a91;
      --ink: #20323c;
      --muted: #647780;
      --paper: #f7f9f8;
      --line: #e1e9e7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }

    
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

.nav {
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--navy);
  text-decoration: none;
  flex-shrink: 0;
}

.mark {
  width: 100px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  background: transparent;
  border-radius: 0;
}

.mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.brand-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 5px;
}

.brand strong {
  display: inline;
  font-size: 1.2rem;
  letter-spacing: 0;
  font-weight: 800;
}

.brand-korean {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--navy);
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.4;
}

nav {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 0.88rem;
  font-weight: 600;
}

nav a:hover,
nav a.active {
  color: var(--teal);
}

.menu-toggle {
  display: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 8px 12px;
  color: var(--navy);
  cursor: pointer;
}

    .page-hero {
      padding: 64px 0;
      color: white;
      background: linear-gradient(120deg, #102d43, #1c4a5b 72%, #367d79);
    }

    .eyebrow {
      color: #a9d9ce;
      font-size: .76rem;
      letter-spacing: .16em;
      font-weight: 700;
    }

    .page-hero h1 {
      margin: 12px 0;
      font-size: clamp(2.3rem, 5vw, 3.5rem);
      line-height: 1.2;
    }

    .crumb { color: #d8e5e9; font-size: .85rem; }
    .crumb a { color: #b5e4d7; text-decoration: underline; }

    main { padding: 60px 0 80px; }

    .category {
      color: var(--teal);
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .12em;
    }

    h2 {
      margin: 10px 0;
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .post-date { color: var(--muted); font-size: .88rem; }

    .post-image {
      display: block;
      max-width: 100%;
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      margin: 30px auto;
      border-radius: 10px;
      background: var(--paper);
    }

    .attachment {
      margin: 28px 0;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
    }

    .attachment h3 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 1rem;
    }

    .attachment a {
      color: var(--teal);
      overflow-wrap: anywhere;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-body {
      min-height: 150px;
      padding: 30px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    .post-body p { margin: 0 0 1em; }
    .post-body p:last-child { margin-bottom: 0; }

    .post-navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 28px;
    }

    .post-nav-item {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      min-width: 0;
    }

    .post-nav-label {
      display: block;
      color: var(--muted);
      font-size: .78rem;
    }

    .post-nav-title {
      display: block;
      margin-top: 5px;
      color: var(--navy);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .post-nav-item:hover { background: var(--paper); }

    .back {
      display: inline-flex;
      margin-top: 28px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--navy);
      font-weight: 700;
    }

    .back:hover { background: var(--paper); }

    footer {
      padding: 24px 0;
      background: #0c2232;
      color: #b9cbd1;
      font-size: .8rem;
    }

    footer .wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }

    
@media (max-width: 820px) {
  .menu-toggle {
    display: block;
  }

  nav {
    display: none;
    position: absolute;
    top: 82px;
    left: 0;
    right: 0;
    padding: 18px 24px 24px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  nav.open {
    display: flex;
  }

  .nav {
    gap: 12px;
  }

  .brand {
    gap: 10px;
  }

  .mark {
    width: 76px;
    height: 48px;
  }

  .brand strong {
    font-size: 1rem;
  }

  .brand-korean {
    font-size: 0.88rem;
  }

  .brand small {
    font-size: 0.68rem;
  }
}

@media (max-width: 560px) {
  .nav {
    gap: 8px;
  }

  .mark {
    width: 56px;
    height: 40px;
  }

  .brand {
    gap: 8px;
  }

  .brand-line {
    gap: 4px;
  }

  .brand strong {
    font-size: 0.9rem;
  }

  .brand-korean {
    font-size: 0.76rem;
  }

  .brand small {
    font-size: 0.58rem;
  }

  .menu-toggle {
    padding: 7px 8px;
    font-size: 0.8rem;
  }

  .post-navigation {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>

<body>
<header>
  <div class="wrap nav">

    <a class="brand" href="index.html" aria-label="EHCL 메인으로">
      <span class="mark">
        <img src="kangwon-logo.png.png" alt="강원대학교 로고">
      </span>

      <span class="brand-text">
        <span class="brand-line">
          <strong>EHCL</strong>
          <b class="brand-korean">환경보건화학연구실</b>
        </span>
        <small>Environmental Health Chemistry Laboratory</small>
      </span>
    </a>

    <button class="menu-toggle" id="menuToggle"
      aria-expanded="false" aria-controls="mainNav">
      메뉴 ☰
    </button>

    <nav id="mainNav" aria-label="주요 메뉴">
      <a href="about.html">About</a>
      <a href="research.html">Research</a>
      <a href="members.html">People</a>
      <a href="publications.html">Publications</a>
      <a href="activities.html" class="active">Community</a>
      <a href="contact.html">Contact</a>
    </nav>

  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow">EHCL · NEWS</div>
    <h1>News</h1>
    <div class="crumb">
      <a href="index.html">홈</a>　/　
      <a href="activities.html">Community</a>　/　News
    </div>
  </div>
</section>

<main class="wrap">
  <article>
    <div class="category">NEWS</div>
    <h2 id="postTitle">뉴스를 불러오는 중입니다.</h2>
    <time id="postDate" class="post-date"></time>

    <img id="postImage" class="post-image" alt="" hidden>

    <section id="attachmentSection" class="attachment" hidden>
      <h3>첨부파일</h3>
      <div id="attachmentList"></div>
    </section>

    <div id="postBody" class="post-body">
      뉴스를 불러오는 중입니다.
    </div>
  </article>

  <nav id="postNavigation" class="post-navigation"
    aria-label="이전 및 다음 뉴스"></nav>

  <a class="back" href="activities.html">← 뉴스 목록으로 돌아가기</a>
</main>

<footer>
  <div class="wrap">
    <span>© EHCL · Environmental Health Chemistry Laboratory</span>
    <span>Kangwon National University</span>
  </div>
</footer>

<script>
const toggle = document.getElementById('menuToggle');
const nav = document.getElementById('mainNav');

toggle.addEventListener('click', () => {
  const isOpen = nav.classList.toggle('open');
  toggle.setAttribute('aria-expanded', String(isOpen));
});

nav.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    nav.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  });
});

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function getSlug(item) {
  return String(item.slug || item.title || '');
}

function newsURL(item) {
  return 'news-detail.html?slug=' + encodeURIComponent(getSlug(item));
}

function renderBody(body) {
  // Markdown의 기본 문단과 줄바꿈을 표시합니다.
  return String(body || '')
    .split(/\r?\n\s*\r?\n/)
    .map(paragraph => {
      const safe = escapeHTML(paragraph).replace(/\r?\n/g, '<br>');
      return safe.trim() ? `<p>${safe}</p>` : '';
    })
    .join('');
}

async function loadNews() {
  const params = new URLSearchParams(window.location.search);
  const requestedSlug = params.get('slug');

  const titleElement = document.getElementById('postTitle');
  const dateElement = document.getElementById('postDate');
  const bodyElement = document.getElementById('postBody');
  const navigation = document.getElementById('postNavigation');

  try {
    const response = await fetch('./data/news.json');

    if (!response.ok) {
      throw new Error('news.json 파일을 불러오지 못했습니다.');
    }

    const newsItems = await response.json();

    if (!Array.isArray(newsItems)) {
      throw new Error('뉴스 데이터 형식이 올바르지 않습니다.');
    }

    newsItems.sort((a, b) =>
      String(b.date || '').localeCompare(String(a.date || ''))
    );

    const currentIndex = newsItems.findIndex(
      item => getSlug(item) === requestedSlug
    );

    if (currentIndex === -1) {
      titleElement.textContent = '뉴스를 찾을 수 없습니다.';
      dateElement.textContent = '';
      bodyElement.textContent =
        '뉴스가 삭제되었거나 주소가 올바르지 않습니다.';
      navigation.innerHTML = '';
      return;
    }

    const item = newsItems[currentIndex];

    document.title = `${item.title || 'News'} | EHCL`;
    titleElement.textContent = item.title || '제목 없음';
    dateElement.textContent = item.date || '';

    // 본문
    bodyElement.innerHTML = renderBody(item.body);

    // 사진
    const image = document.getElementById('postImage');

    if (item.image) {
      image.src = item.image;
      image.alt = item.title || '뉴스 사진';
      image.hidden = false;
    } else {
      image.hidden = true;
      image.removeAttribute('src');
    }

    // 첨부파일
    const attachmentSection =
      document.getElementById('attachmentSection');
    const attachmentList =
      document.getElementById('attachmentList');

    const attachments = [];

    if (typeof item.attachment === 'string' && item.attachment.trim()) {
      attachments.push({
        url: item.attachment,
        name: item.attachment.split('/').pop() || '첨부파일'
      });
    } else if (
      item.attachment &&
      typeof item.attachment === 'object'
    ) {
      const url = item.attachment.url || item.attachment.path;
      if (url) {
        attachments.push({
          url,
          name: item.attachment.name || url.split('/').pop() || '첨부파일'
        });
      }
    }

    if (Array.isArray(item.attachments)) {
      item.attachments.forEach(file => {
        if (typeof file === 'string' && file.trim()) {
          attachments.push({
            url: file,
            name: file.split('/').pop() || '첨부파일'
          });
        } else if (file && typeof file === 'object') {
          const url = file.url || file.path;
          if (url) {
            attachments.push({
              url,
              name: file.name || url.split('/').pop() || '첨부파일'
            });
          }
        }
      });
    }

    if (attachments.length > 0) {
      attachmentList.innerHTML = attachments.map(file => `
        <p>
          <a href="${escapeHTML(file.url)}" target="_blank"
            rel="noopener noreferrer" download>
            📎 ${escapeHTML(file.name)}
          </a>
        </p>
      `).join('');
      attachmentSection.hidden = false;
    } else {
      attachmentSection.hidden = true;
      attachmentList.innerHTML = '';
    }

    // 이전 뉴스와 다음 뉴스
    const previousItem = newsItems[currentIndex + 1];
    const nextItem = newsItems[currentIndex - 1];

    navigation.innerHTML = `
      <div>
        ${previousItem ? `
          <a class="post-nav-item" href="${newsURL(previousItem)}">
            <span class="post-nav-label">← 이전 뉴스</span>
            <span class="post-nav-title">${escapeHTML(previousItem.title || '제목 없음')}</span>
          </a>
        ` : ''}
      </div>
      <div>
        ${nextItem ? `
          <a class="post-nav-item" href="${newsURL(nextItem)}">
            <span class="post-nav-label">다음 뉴스 →</span>
            <span class="post-nav-title">${escapeHTML(nextItem.title || '제목 없음')}</span>
          </a>
        ` : ''}
      </div>
    `;

  } catch (error) {
    console.error('뉴스 상세 페이지 오류:', error);
    titleElement.textContent = '뉴스를 불러오지 못했습니다.';
    dateElement.textContent = '';
    bodyElement.textContent =
      '뉴스 데이터 파일을 확인해 주세요.';
    navigation.innerHTML = '';
  }
}

loadNews();
</script>
</body>
</html>
